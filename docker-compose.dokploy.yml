# docker-compose.dokploy.yml
# Deployment configuration for Dokploy
# Dokploy will build images from source and route traffic using Traefik.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-govjobpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-govjobpulse}
      POSTGRES_DB:       ${POSTGRES_DB:-govjobpulse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-govjobpulse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL:         postgresql://${POSTGRES_USER:-govjobpulse}:${POSTGRES_PASSWORD:-govjobpulse}@postgres:5432/${POSTGRES_DB:-govjobpulse}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.yourdomain.com}
      REDIS_URL:            redis://redis:6379
      NODE_ENV:             production
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      # Route requests for your main domain to this container
      - "traefik.http.routers.govjobpulse-web.rule=Host(`${DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.govjobpulse-web.entrypoints=websecure"
      - "traefik.http.services.govjobpulse-web.loadbalancer.server.port=3000"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-govjobpulse}:${POSTGRES_PASSWORD:-govjobpulse}@postgres:5432/${POSTGRES_DB:-govjobpulse}
      REDIS_URL:    redis://redis:6379
      JWT_SECRET:   ${JWT_SECRET:?JWT_SECRET must be set}
      NODE_ENV:     production
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      # Route requests for admin subdomain to this container
      - "traefik.http.routers.govjobpulse-admin.rule=Host(`admin.${DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.govjobpulse-admin.entrypoints=websecure"
      - "traefik.http.services.govjobpulse-admin.loadbalancer.server.port=3001"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL:       postgresql://${POSTGRES_USER:-govjobpulse}:${POSTGRES_PASSWORD:-govjobpulse}@postgres:5432/${POSTGRES_DB:-govjobpulse}
      REDIS_URL:          redis://redis:6379
      WORKER_HEALTH_PORT: 3002
      NODE_ENV:           production
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - default

volumes:
  postgres_data:
  redis_data:

networks:
  dokploy-network:
    external: true
