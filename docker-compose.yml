# NOT RUN in this sandbox — no `docker` binary is available here (see
# CLAUDE.md). Written correctly and reviewed manually; `docker compose up`
# actually working end-to-end is explicitly Phase 15's job per Section 11
# ("Confirm docker compose up actually works end-to-end before closing
# this phase"). This phase's job (Section 9) was narrower: get the
# /health /ready /live endpoints wired into a real compose file's
# healthcheck directives, which this does.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: govjobpulse
      POSTGRES_PASSWORD: govjobpulse
      POSTGRES_DB: govjobpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govjobpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://govjobpulse:govjobpulse@postgres:5432/govjobpulse
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://govjobpulse:govjobpulse@postgres:5432/govjobpulse
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://govjobpulse:govjobpulse@postgres:5432/govjobpulse
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
